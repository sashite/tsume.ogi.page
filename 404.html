			No-FOUC theme. Three themes — light (default), dark, and system. A saved
			choice is applied to <html data-theme> before first paint so the page
			never flashes the wrong scheme; with no saved choice the attribute is
			absent and the stylesheet follows prefers-color-scheme.
		-->
		<script>
			(function () {
				// Apply the saved theme (light/dark) to <html data-theme> before first paint
				// so the page never flashes the wrong scheme. With no saved choice the
				// attribute stays absent and the stylesheet follows prefers-color-scheme.
				try {
					var t = localStorage.getItem('sashite:theme');
					if (t === 'light' || t === 'dark') {
						document.documentElement.setAttribute('data-theme', t);
					}
				} catch (e) {
					/* private mode / storage disabled — fall back to system */
				}
			})();
		</script>
